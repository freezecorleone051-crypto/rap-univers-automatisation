name: Rap Univers - sorties musicales

on:
  schedule:
    # GitHub Actions utilise l'heure UTC. Lubumbashi = UTC+2.
    # Local jeudi-dimanche 00h-18h = UTC : 0-16h (jeu-dim) + 22-23h (mer-sam)
    - cron: "0 0-16 * * 0,4-6"
    - cron: "0 22-23 * * 3-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rap-univers-publications
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Rechercher et publier les nouveautés
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DRY_RUN: "true"
        run: python bot.py

      - name: Sauvegarder les sorties déjà publiées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          if ! git diff --cached --quiet; then
            git commit -m "Mettre à jour les sorties déjà publiées"
            git push
          fi
